name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# gh release create needs write access; new repos default GITHUB_TOKEN
# to read-only, which fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: ./Scripts/build_app.sh ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flick
          path: Flick.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: re-running a tag's workflow refreshes the asset
          # instead of failing on "release already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" Flick.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" Flick.zip --title "Flick ${GITHUB_REF_NAME}" --generate-notes
          fi
