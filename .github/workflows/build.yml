name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: ./Scripts/build_app.sh ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peek
          path: Peek.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" Peek.zip --title "Peek ${GITHUB_REF_NAME}" --generate-notes
